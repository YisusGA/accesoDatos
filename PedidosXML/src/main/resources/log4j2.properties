
# ==========================================
# CONFIGURACIÓN GENERAL (mensajes internos log4j)
# ==========================================

status = WARN

# ==========================================
# APPENDER: CONSOLA
# ==========================================

appender.consola.type = Console
appender.consola.name = Consola
appender.consola.target = SYSTEM_OUT
appender.consola.layout.type = PatternLayout
appender.consola.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %c{1} - %msg%n

# ==========================================
# APPENDER: FICHERO ROTATIVO
# ==========================================

appender.rotativo.type = RollingFile
appender.rotativo.name = FicheroRotativo
appender.rotativo.fileName = logs/rotativo.log
appender.rotativo.filePattern = logs/aplicacion-%d{yyyy-MM-dd}-%i.log.gz

appender.rotativo.layout.type = PatternLayout
appender.rotativo.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %c{1} - %msg%n

# Políticas de rotación
appender.rotativo.policies.type = Policies

appender.rotativo.policies.size.type = SizeBasedTriggeringPolicy
appender.rotativo.policies.size.size = 10MB

appender.rotativo.policies.time.type = TimeBasedTriggeringPolicy

# Máximo de archivos por ventana de rotación
appender.rotativo.strategy.type = DefaultRolloverStrategy
appender.rotativo.strategy.max = 10

# ==========================================
# APPENDER: FICHERO
# ==========================================

appender.secuencial.type = File
appender.secuencial.name = Fichero
appender.secuencial.fileName = logs/fichero.log
appender.secuencial.append = true

appender.secuencial.layout.type = PatternLayout
appender.secuencial.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %c{1} - %msg%n

# ==========================================
# ROOT LOGGER (por defecto)
# ==========================================

rootLogger.level = error

rootLogger.appenderRef.rotativo.ref = FicheroRotativo
rootLogger.appenderRef.consola.ref = Consola
